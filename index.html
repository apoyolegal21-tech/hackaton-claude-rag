<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Expedientes</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0eee8; --border: #dedad0;
  --text: #1f1d1a; --muted: #6b665c; --accent: #6b2737; --accent-soft: #f3e6e9;
  --red: #b42318; --red-soft: #fde8e6; --amber: #a15c07; --amber-soft: #fdf1dc;
  --green: #1f7a4d; --green-soft: #e3f4ea; --yellow-soft: #fff7d1;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #1f1e1c; --surface-2: #2a2826; --border: #3a3734;
    --text: #ece9e3; --muted: #a39d92; --accent: #d98a9b; --accent-soft: #3a2228;
    --red: #f2877c; --red-soft: #3d1f1c; --amber: #f0b45c; --amber-soft: #3a2c16;
    --green: #6fcf97; --green-soft: #1a3326; --yellow-soft: #36301a;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --surface: #1f1e1c; --surface-2: #2a2826; --border: #3a3734;
  --text: #ece9e3; --muted: #a39d92; --accent: #d98a9b; --accent-soft: #3a2228;
  --red: #f2877c; --red-soft: #3d1f1c; --amber: #f0b45c; --amber-soft: #3a2c16;
  --green: #6fcf97; --green-soft: #1a3326; --yellow-soft: #36301a;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 20px 0 60px; }
h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.pad { padding: 16px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1f1e1c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1f1e1c; } }
.btn.danger { color: var(--red); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.gray { background: var(--surface-2); color: var(--muted); }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); margin-left: 4px; }
.tag.verif { background: var(--yellow-soft); color: var(--amber); }
.tag.ok { background: var(--green-soft); color: var(--green); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; }
fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 14px; margin: 0 0 14px; }
legend { font-weight: 600; padding: 0 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--text); padding: 4px 0; }
.check input { margin-top: 4px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.req { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.req:last-child { border-bottom: 0; }
.req .boxes { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.req .boxes label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
.req.done .t { color: var(--muted); text-decoration: line-through; }
.why { font-size: 12.5px; color: var(--muted); }
.timeline { position: relative; margin-left: 8px; padding-left: 22px; border-left: 2px solid var(--border); }
.step { position: relative; padding: 8px 0 14px; }
.step::before { content: ""; position: absolute; left: -29px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); }
.step.done::before { background: var(--green); border-color: var(--green); }
.step.red::before { border-color: var(--red); background: var(--red-soft); }
.step.amber::before { border-color: var(--amber); background: var(--amber-soft); }
.step.firma::before { background: var(--accent); border-color: var(--accent); width: 16px; height: 16px; left: -31px; }
.step .line1 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.step .ttl { font-weight: 600; }
.step.done .ttl { color: var(--muted); text-decoration: line-through; }
.step .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.step .meta input[type=date] { padding: 3px 6px; font-size: 13px; }
.phase { font-weight: 700; color: var(--accent); margin: 10px 0 2px -22px; padding-left: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > * { min-width: 0; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } .hide-sm { display: none; } }
@media (max-width: 520px) { .req { grid-template-columns: 1fr; } }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
.notice { background: var(--yellow-soft); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.filters button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Control de Expedientes
        <small>Notaría Pública 41 · Compraventa de inmueble</small></div>
      <div class="row">
        <button class="btn" id="btnTheme" title="Cambiar tema">◐</button>
      </div>
    </div>
    <nav id="nav">
      <button data-view="lista">Expedientes</button>
      <button data-view="agenda">Agenda</button>
      <button data-view="alta">+ Nuevo expediente</button>
      <button data-view="respaldo">Respaldo</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   1. CATÁLOGOS
   ========================================================================= */
const RESPONSABLES = ['Recepción', 'Proyectista', 'Titular', 'Contador', 'Gestor'];

// Datos de contacto que aparecen en la lista que se envía al cliente
const NOTARIA = { correo: 'notaria41nay@gmail.com', whatsapp: '311 340 75 98' };

// Tipo de plazo:
//   'verificado' → término legal verificado en la ley (🟢, lleva su fundamento)
//   'verificar'  → término legal pendiente de verificar en fuente oficial (🟡)
//   'interno'    → práctica de la notaría (no es un término legal)
const VERIFICADO = 'verificado', VERIF = 'verificar', INTERNO = 'interno';

/* =========================================================================
   2. REGLAS — requisitos que se piden al cliente
   Base: «Requisitos escrituras_Not 41» (actos traslativos de dominio).
   Las reglas marcadas con propuesta: true NO están en esa lista: son
   complementos por variable, pendientes de validar por el titular.
   ========================================================================= */
const esFis = t => t === 'fisica', esMor = t => t === 'moral';
const REQUISITOS = [
  // ---- Parte enajenante (vendedor)
  { id: 'v_ine', grupo: 'Vendedor', texto: 'Identificación oficial vigente con fotografía (INE o pasaporte; originales al momento de firmar)', aplicaSi: e => esFis(e.vendedorTipo) },
  { id: 'v_mat', grupo: 'Vendedor', texto: 'Acta de matrimonio', aplicaSi: e => esFis(e.vendedorTipo) && e.vendedorCivil !== 'soltero', why: 'Vendedor casado' },
  { id: 'v_cony', grupo: 'Vendedor', texto: 'Comparecencia del cónyuge con su identificación, para otorgar su consentimiento', aplicaSi: e => esFis(e.vendedorTipo) && e.vendedorCivil === 'sociedad', why: 'Casado en sociedad conyugal', propuesta: true },
  { id: 'v_dom', grupo: 'Vendedor', texto: 'Copia de comprobante de domicilio (no mayor a tres meses de antigüedad)', aplicaSi: e => esFis(e.vendedorTipo) },
  { id: 'v_csf', grupo: 'Vendedor', texto: 'Constancia de situación fiscal (no mayor a tres meses de antigüedad)', aplicaSi: e => esFis(e.vendedorTipo) },
  { id: 'v_gen', grupo: 'Vendedor', texto: 'Llenar formato de datos generales', aplicaSi: () => true },
  { id: 'vm_acta', grupo: 'Vendedor', texto: 'Acta constitutiva (original o copia certificada) y, en su caso, actas de reformas estatutarias', aplicaSi: e => esMor(e.vendedorTipo), why: 'Persona moral' },
  { id: 'vm_csf', grupo: 'Vendedor', texto: 'Constancia de situación fiscal de la empresa', aplicaSi: e => esMor(e.vendedorTipo), why: 'Persona moral' },
  { id: 'vm_poder', grupo: 'Vendedor', texto: 'Poder con actos de dominio para el representante', aplicaSi: e => esMor(e.vendedorTipo), why: 'Persona moral' },
  { id: 'vm_ine', grupo: 'Vendedor', texto: 'Identificación oficial vigente del representante', aplicaSi: e => esMor(e.vendedorTipo), why: 'Persona moral', propuesta: true },
  { id: 'vm_bc', grupo: 'Vendedor', texto: 'Datos de identificación del beneficiario controlador', aplicaSi: e => esMor(e.vendedorTipo), why: 'Persona moral · LFPIORPI', propuesta: true },
  { id: 'v_apod', grupo: 'Vendedor', texto: 'Si vende por medio de apoderado: poder original (o copia certificada) con actos de dominio', aplicaSi: e => e.apoderado, why: 'Interviene apoderado' },
  { id: 'v_pagos', grupo: 'Vendedor', texto: 'Comprobante de los pagos que, en su caso, haya realizado el futuro comprador', aplicaSi: () => true },
  { id: 'v_exe1', grupo: 'Vendedor', texto: 'Documentos que acrediten que el inmueble es su casa habitación', aplicaSi: e => esFis(e.vendedorTipo) && e.exencionISR, why: 'Solicita exención de ISR', propuesta: true },
  { id: 'v_exe2', grupo: 'Vendedor', texto: 'Manifestar bajo protesta que no enajenó otra casa habitación con exención en los 3 años anteriores', aplicaSi: e => esFis(e.vendedorTipo) && e.exencionISR, why: 'Exención de ISR · LISR art. 93-XIX-a' },
  // ---- Parte adquirente (comprador)
  { id: 'c_ine', grupo: 'Comprador', texto: 'Identificación oficial vigente con fotografía (INE o pasaporte; originales al momento de firmar)', aplicaSi: e => esFis(e.compradorTipo) },
  { id: 'c_curp', grupo: 'Comprador', texto: 'Copia de la Clave Única de Registro de Población (CURP)', aplicaSi: e => esFis(e.compradorTipo) && !e.compradorExtranjero },
  { id: 'c_mat', grupo: 'Comprador', texto: 'Acta de matrimonio', aplicaSi: e => esFis(e.compradorTipo) && e.compradorCasado, why: 'Comprador casado' },
  { id: 'c_dom', grupo: 'Comprador', texto: 'Copia de comprobante de domicilio (no mayor a tres meses de antigüedad)', aplicaSi: e => esFis(e.compradorTipo) },
  { id: 'c_csf', grupo: 'Comprador', texto: 'Constancia de situación fiscal (no mayor a tres meses de antigüedad)', aplicaSi: e => esFis(e.compradorTipo) },
  { id: 'c_gen', grupo: 'Comprador', texto: 'Llenar formato de datos generales', aplicaSi: () => true },
  { id: 'cm_acta', grupo: 'Comprador', texto: 'Acta constitutiva (original o copia certificada) y, en su caso, actas de reformas estatutarias', aplicaSi: e => esMor(e.compradorTipo), why: 'Persona moral' },
  { id: 'cm_csf', grupo: 'Comprador', texto: 'Constancia de situación fiscal de la empresa', aplicaSi: e => esMor(e.compradorTipo), why: 'Persona moral' },
  { id: 'cm_poder', grupo: 'Comprador', texto: 'Poder con actos de administración o dominio para el representante', aplicaSi: e => esMor(e.compradorTipo), why: 'Persona moral' },
  { id: 'cm_bc', grupo: 'Comprador', texto: 'Datos de identificación del beneficiario controlador', aplicaSi: e => esMor(e.compradorTipo), why: 'Persona moral · LFPIORPI', propuesta: true },
  { id: 'c_apod', grupo: 'Comprador', texto: 'Si compra por medio de apoderado: poder original (o copia certificada) con facultades suficientes', aplicaSi: e => e.apoderado, why: 'Interviene apoderado' },
  { id: 'c_ext1', grupo: 'Comprador', texto: 'Pasaporte vigente y documento migratorio', aplicaSi: e => e.compradorExtranjero, why: 'Comprador extranjero', propuesta: true },
  { id: 'c_ext2', grupo: 'Comprador', texto: 'Elección de institución fiduciaria y datos para el fideicomiso', aplicaSi: e => e.compradorExtranjero && e.zonaRestringida, why: 'Extranjero en zona restringida', propuesta: true },
  // ---- Crédito
  { id: 'o_hip1', grupo: 'Crédito', texto: 'Carta de instrucción / asignación de crédito de la institución', aplicaSi: e => e.pago === 'hipoteca', why: 'Crédito con garantía hipotecaria', propuesta: true },
  { id: 'o_hip2', grupo: 'Crédito', texto: 'Avalúo de la institución acreditante', aplicaSi: e => e.pago === 'hipoteca', why: 'Crédito con garantía hipotecaria', propuesta: true },
  { id: 'o_inf', grupo: 'Crédito', texto: 'Constancia de crédito y precalificación (INFONAVIT/FOVISSSTE)', aplicaSi: e => e.pago === 'hipoteca' && e.acreedor !== 'banco', why: 'Crédito de vivienda institucional', propuesta: true },
  // ---- Inmueble
  { id: 'i_tit', grupo: 'Inmueble', texto: 'Antecedentes: escritura o título de propiedad (original o copia certificada)', aplicaSi: () => true },
  { id: 'i_pred', grupo: 'Inmueble', texto: 'Pago predial (al corriente)', aplicaSi: () => true },
  { id: 'i_agua', grupo: 'Inmueble', texto: 'Pago del agua (al corriente)', aplicaSi: () => true },
  { id: 'i_gravc', grupo: 'Inmueble', texto: 'Carta de instrucción expedida por el acreedor para cancelar la hipoteca vigente', aplicaSi: e => e.inmuebleGravado, why: 'El inmueble tiene hipoteca vigente' },
  { id: 'i_cond1', grupo: 'Inmueble', texto: 'Escritura del régimen de propiedad en condominio y reglamento', aplicaSi: e => e.condominio, why: 'Condominio', propuesta: true },
  { id: 'i_cond2', grupo: 'Inmueble', texto: 'Constancia de no adeudo de cuotas expedida por el administrador', aplicaSi: e => e.condominio, why: 'Condominio', propuesta: true },
  { id: 'i_ejido', grupo: 'Inmueble', texto: 'Título de dominio pleno (RAN) y constancia del derecho del tanto', aplicaSi: e => e.ejidal, why: 'Origen ejidal', propuesta: true },
];
const GRUPOS = ['Vendedor', 'Comprador', 'Crédito', 'Inmueble'];

/* =========================================================================
   3. REGLAS — cronograma (antes, durante y después de la firma)
   plazo: { ref: 'alta'|'firma', dias, habiles? } | { ref: 'tarea', tarea, dias } | { tipo: 'dia17' }
   ========================================================================= */
const TAREAS = [
  // --- Prefirma
  { id: 't_lista', etapa: 'prefirma', texto: 'Enviar lista de requisitos al cliente', resp: 'Recepción', plazo: { ref: 'alta', dias: 0 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_asig', etapa: 'prefirma', texto: 'Asignar proyectista en el Control de trámites', resp: 'Titular', plazo: { ref: 'alta', dias: 1 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_presu', etapa: 'prefirma', texto: 'Elaborar y enviar presupuesto', resp: 'Proyectista', plazo: { ref: 'alta', dias: 2 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_clg', etapa: 'prefirma', texto: 'Presentar primer aviso preventivo y solicitar certificado de libertad de gravamen', resp: 'Gestor', plazo: { ref: 'alta', dias: 3 }, tipo: INTERNO, nota: 'Ajuste aquí la fecha real de presentación: de ella dependen la vigencia del aviso (30 días naturales) y las fechas del RPP.', aplicaSi: () => true },
  { id: 't_aval', etapa: 'prefirma', texto: 'Avalúo validado por catastro (lo tramita la notaría o el cliente)', resp: 'Gestor', plazo: { ref: 'alta', dias: 3 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_reqok', etapa: 'prefirma', texto: 'Requisitos completos y cotejados', resp: 'Proyectista', plazo: { ref: 'firma', dias: -7 }, tipo: INTERNO, auto: 'requisitos', aplicaSi: () => true },
  { id: 't_fide', etapa: 'prefirma', texto: 'Permiso SRE y aceptación de la fiduciaria para el fideicomiso', resp: 'Proyectista', plazo: { ref: 'firma', dias: -15 }, tipo: VERIF, aplicaSi: e => e.compradorExtranjero && e.zonaRestringida },
  { id: 't_ejido', etapa: 'prefirma', texto: 'Verificar dominio pleno y notificación del derecho del tanto', resp: 'Proyectista', plazo: { ref: 'firma', dias: -15 }, tipo: VERIF, aplicaSi: e => e.ejidal },
  { id: 't_cond', etapa: 'prefirma', texto: 'Recabar constancia de no adeudo de cuotas condominales', resp: 'Gestor', plazo: { ref: 'firma', dias: -7 }, tipo: INTERNO, aplicaSi: e => e.condominio },
  { id: 't_proy', etapa: 'prefirma', texto: 'Elaborar proyecto de escritura (EP #### PROYECTO)', resp: 'Proyectista', plazo: { ref: 'firma', dias: -7 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_inst', etapa: 'prefirma', texto: 'Enviar proyecto a la institución acreditante para visto bueno', resp: 'Proyectista', plazo: { ref: 'firma', dias: -6 }, tipo: INTERNO, aplicaSi: e => e.pago === 'hipoteca' },
  { id: 't_rev', etapa: 'prefirma', texto: 'Revisión del proyecto por el titular', resp: 'Titular', plazo: { ref: 'firma', dias: -5 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_poder', etapa: 'prefirma', texto: 'Verificar vigencia del poder (no revocación / RENAP)', resp: 'Proyectista', plazo: { ref: 'firma', dias: -5 }, tipo: INTERNO, aplicaSi: e => e.apoderado || esMor(e.vendedorTipo) || esMor(e.compradorTipo) },
  { id: 't_exe', etapa: 'prefirma', texto: 'Consultar en el SAT si el vendedor aplicó la exención en los 5 años anteriores', resp: 'Contador', plazo: { ref: 'firma', dias: -3 }, tipo: INTERNO, fund: 'LISR art. 93-XIX-a', aplicaSi: e => esFis(e.vendedorTipo) && e.exencionISR },
  { id: 't_vobo', etapa: 'prefirma', texto: 'Visto bueno del cliente, despacho o gestor', resp: 'Proyectista', plazo: { ref: 'firma', dias: -3 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_pld', etapa: 'prefirma', texto: 'Identificación PLD: consulta de listas y umbral de aviso', resp: 'Proyectista', plazo: { ref: 'firma', dias: -3 }, tipo: INTERNO, aplicaSi: () => true },
  { id: 't_isr', etapa: 'prefirma', texto: 'Solicitar cálculo de ISR al contador', resp: 'Contador', plazo: { ref: 'firma', dias: -2 }, tipo: INTERNO, nota: 'Práctica: pedirlo con 1–2 días de anticipación', aplicaSi: () => true },
  { id: 't_fondos', etapa: 'prefirma', texto: 'Recibir provisión para impuestos, derechos y honorarios', resp: 'Recepción', plazo: { ref: 'firma', dias: -1 }, tipo: INTERNO, aplicaSi: () => true },
  // --- Firma

/* =========================================================================
   4. FECHAS
   ========================================================================= */
const hoyISO = () => toISO(new Date());
function toISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); }
function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 864e5); }
function fmt(s) { return s ? parseISO(s).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }

// Días inhábiles del art. 12 del CFF (no incluye vacaciones de la autoridad,
// que no aplican a declaraciones y pagos)
function nLunes(y, m, n) { const d = new Date(y, m, 1); d.setDate(1 + (8 - d.getDay()) % 7 + 7 * (n - 1)); return toISO(d); }
function inhabil(s) {
  const d = parseISO(s), y = d.getFullYear(), md = s.slice(5);
  if (d.getDay() === 0 || d.getDay() === 6) return true;
  if (['01-01', '05-01', '05-05', '09-16', '12-25'].includes(md)) return true;
  if (md === '12-01' && (y - 2024) % 6 === 0) return true;
  return [nLunes(y, 1, 1), nLunes(y, 2, 3), nLunes(y, 10, 3)].includes(s);
}
function addHabiles(s, n) { let d = s; while (n > 0) { d = addDays(d, 1); if (!inhabil(d)) n--; } return d; }

// fechaDe: fecha (con ajuste manual, si lo hay) de otra tarea del mismo expediente
function fechaLimite(regla, exp, fechaDe) {
  const p = regla.plazo;
  if (p.tipo === 'dia17') { const d = parseISO(exp.fechaFirma); return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 17)); }
  const base = p.ref === 'alta' ? exp.fechaAlta : p.ref === 'tarea' ? fechaDe(p.tarea) : exp.fechaFirma;
  return p.habiles ? addHabiles(base, p.dias) : addDays(base, p.dias);
}

/* =========================================================================
   6. CÁLCULO DEL EXPEDIENTE
   ========================================================================= */
function requisitosDe(exp) { return REQUISITOS.filter(r => r.aplicaSi(exp)); }
function tareasDe(exp) {
  const memo = {};
  const fechaDe = id => memo[id] ??= ((exp.tareas[id] || {}).fecha || fechaLimite(TAREAS.find(t => t.id === id), exp, fechaDe));
  return TAREAS.filter(t => t.aplicaSi(exp)).map(t => {
    const st = exp.tareas[t.id] || {};
    const done = t.auto === 'requisitos' ? requisitosCompletos(exp) : !!st.hecho;
    return { ...t, fecha: fechaDe(t.id), ajustada: !!st.fecha, hecho: done, resp: st.resp || t.resp };
  }).sort((a, b) => a.fecha.localeCompare(b.fecha));
}
// Alerta: la firma debe caer dentro de la vigencia del primer aviso preventivo
function alertaAviso(exp, tareas) {
  const av = tareas.find(t => t.id === 't_clg');
  const vence = addDays(av.fecha, 30);
  if (exp.fechaFirma <= vence) return '';
  return `<div class="notice" style="background:var(--red-soft);color:var(--red)">⚠️ La firma (${fmt(exp.fechaFirma)}) cae después de que vence el primer aviso preventivo (${fmt(vence)}; 30 días naturales desde su presentación, Ley del RPP Nay. art. 91-I). Habrá que presentar un nuevo aviso, que solo procede 15 días naturales después de que el anterior quede sin efectos.</div>`;
}
function requisitosCompletos(exp) { return requisitosDe(exp).every(r => (exp.requisitos[r.id] || {}).recibido); }

function semaforo(fecha, hecho) {
  if (hecho) return 'done';
  const d = diffDays(fecha, hoyISO());
  if (d < 0) return 'red';
  if (d <= 3) return 'amber';
  return 'green';
}
function resumen(exp) {
  const reqs = requisitosDe(exp), tareas = tareasDe(exp);
  const reqOk = reqs.filter(r => (exp.requisitos[r.id] || {}).recibido).length;
  const tarOk = tareas.filter(t => t.hecho).length;
  const pend = tareas.filter(t => !t.hecho);
  const vencidas = pend.filter(t => semaforo(t.fecha) === 'red').length;
  const proximas = pend.filter(t => semaforo(t.fecha) === 'amber').length;
  const avance = Math.round(100 * (reqOk + tarOk) / (reqs.length + tareas.length));
  return { reqs, tareas, reqOk, tarOk, vencidas, proximas, avance, siguiente: pend[0] };
}
function pillEstado(r) {
  if (r.avance === 100) return '<span class="pill gray">Concluido</span>';
  if (r.vencidas) return `<span class="pill red">${r.vencidas} vencida${r.vencidas > 1 ? 's' : ''}</span>`;
  if (r.proximas) return `<span class="pill amber">${r.proximas} por vencer</span>`;
  return '<span class="pill green">Al día</span>';
}
function tagPlazo(t) {
  if (t.tipo === VERIFICADO) return `<span class="tag ok" title="Término legal verificado">🟢 ${esc(t.fund)}</span>`;
  if (t.tipo === VERIF) return '<span class="tag verif" title="Término legal pendiente de verificar en fuente oficial">🟡 plazo por verificar</span>';
  return `<span class="tag" title="Práctica interna de la notaría">práctica interna</span>${t.fund ? ` <span class="tag">${esc(t.fund)}</span>` : ''}`;
}
function descVariables(e) {
  const p = t => t === 'moral' ? 'persona moral' : 'persona física';
  const out = [`Vendedor: ${p(e.vendedorTipo)}`, `Comprador: ${p(e.compradorTipo)}${e.compradorExtranjero ? ' extranjera' : ''}`,
    e.pago === 'hipoteca' ? `Crédito hipotecario (${e.acreedor === 'banco' ? 'banco' : e.acreedor.toUpperCase()})` : 'De contado'];
  if (e.condominio) out.push('Condominio');
  if (e.zonaRestringida) out.push('Zona restringida');
  if (e.ejidal) out.push('Origen ejidal');
  if (e.inmuebleGravado) out.push('Con hipoteca previa');
  if (e.apoderado) out.push('Con apoderado');
  if (e.exencionISR) out.push('Exención ISR');
  return out;
}

}
function exp() { return DB.expedientes.find(x => x.id === actual); }
function setReq(rid, k, v) { const e = exp(); e.requisitos[rid] = { ...(e.requisitos[rid] || {}), [k]: v }; if (k === 'cotejado' && v) e.requisitos[rid].recibido = true; if (k === 'recibido' && v) e.requisitos[rid].pedido = true; guardar(); render(); }
function setTarea(tid, k, v) { const e = exp(); e.tareas[tid] = { ...(e.tareas[tid] || {}), [k]: v }; guardar(); render(); }
function borrar(id) { if (!confirm('¿Eliminar este expediente? No se puede deshacer.')) return; DB.expedientes = DB.expedientes.filter(x => x.id !== id); guardar(); toast('Expediente eliminado'); ir('lista'); }

function copiarLista(id) {
  const e = DB.expedientes.find(x => x.id === id);
  const pend = requisitosDe(e).filter(r => !(e.requisitos[r.id] || {}).recibido);
  const grupos = [...new Set(pend.map(r => r.grupo))];
  const txt = `*Notaría Pública 41*\nRequisitos para su escritura de compraventa (exp. ${e.numero}):\n\n` +
    grupos.map(g => `*${g}*\n` + pend.filter(r => r.grupo === g).map(r => `• ${r.texto}`).join('\n')).join('\n\n') +
    `\n\n*En caso de copropietarios, se deberá proporcionar de cada uno dicha documentación.*` +
    `\n\n*Otros documentos necesarios (por medio de la notaría):*\n• Avalúo validado (certificado) por catastro (puede tramitarlo el cliente por su cuenta)\n• Certificado de libertad de gravamen con aviso preventivo` +
    `\n\n*NOTA:* Los documentos requeridos podrán enviarse previamente debidamente escaneados al correo de la notaría: ${NOTARIA.correo}, o al WhatsApp ${NOTARIA.whatsapp}, en el entendido de que posteriormente se deberán exhibir los originales para su cotejo.`;
  const ok = () => { pend.forEach(r => e.requisitos[r.id] = { ...(e.requisitos[r.id] || {}), pedido: true }); guardar(); render(); toast('Lista copiada; requisitos marcados como pedidos'); };
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(ok, () => { prompt('Copie la lista:', txt); ok(); });
}

// ---- Agenda global
function vAgenda() {
  const hoy = hoyISO();
  let items = DB.expedientes.flatMap(e => tareasDe(e).filter(t => !t.hecho).map(t => ({ e, t })))
    .sort((a, b) => a.t.fecha.localeCompare(b.t.fecha));
  if (filtroAgenda === 'vencidas') items = items.filter(x => x.t.fecha < hoy);
  if (filtroAgenda === 'semana') items = items.filter(x => diffDays(x.t.fecha, hoy) <= 7);
  const f = (k, l) => `<button class="btn ${filtroAgenda === k ? 'on' : ''}" onclick="filtroAgenda='${k}';render()">${l}</button>`;
  app.innerHTML = `<h2>Agenda de plazos</h2><p class="sub">Tareas pendientes de todos los expedientes, ordenadas por fecha límite.</p>
    <div class="row filters" style="margin-bottom:14px">${f('vencidas', 'Vencidas')}${f('semana', 'Próximos 7 días')}${f('todo', 'Todo')}</div>
    ${items.length ? `<div class="card"><table><thead><tr><th>Fecha límite</th><th>Tarea</th><th class="hide-sm">Expediente</th><th class="hide-sm">Responsable</th></tr></thead><tbody>
      ${items.map(({ e, t }) => { const s = semaforo(t.fecha); return `<tr class="click" onclick="ir('detalle','${e.id}')">
        <td><span class="pill ${s}">${fmt(t.fecha)}</span></td><td>${esc(t.texto)} ${t.tipo === VERIF ? '<span class="tag verif">🟡</span>' : ''}</td>
        <td class="hide-sm">${esc(e.numero)}</td><td class="hide-sm">${esc(t.resp)}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="card empty">Nada pendiente en este filtro. 👌</div>`}`;
}

// ---- Respaldo
function vRespaldo() {
  app.innerHTML = `<h2>Respaldo</h2><p class="sub">Los expedientes se guardan solo en este navegador. Exporte un respaldo con regularidad.</p>
    <div class="card pad"><div class="row">
      <button class="btn primary" onclick="exportar()">Exportar respaldo (JSON)</button>
      <label class="btn">Importar respaldo<input type="file" accept="application/json" style="display:none" onchange="importar(this.files[0])"></label>
      <button class="btn" onclick="cargarEjemplos()">Cargar expedientes de ejemplo</button>
      <button class="btn danger" onclick="if(confirm('¿Borrar todos los expedientes de este navegador?')){DB.expedientes=[];guardar();toast('Datos borrados');ir('lista')}">Borrar todo</button>
    </div></div>
    <h3>Sobre los plazos</h3><div class="card pad why" style="font-size:14px">
      <p><span class="tag ok">🟢 fundamento</span> Término legal verificado en la ley (carpeta de normativa, 31-oct-2026); se indica el artículo.</p>
      <p><span class="tag verif">🟡 plazo por verificar</span> Término legal tomado del vault de la notaría que aún no se ha verificado en fuente oficial. La fecha es una propuesta editable.</p>
      <p><span class="tag">práctica interna</span> Plazo de organización de la notaría, no un término legal.</p></div>`;
}
function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }));
  a.download = `expedientes-n41-${hoyISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importar(file) {
  if (!file) return;
  file.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.expedientes)) throw 0; DB = d; guardar(); toast(`${d.expedientes.length} expedientes importados`); ir('lista'); })
    .catch(() => toast('El archivo no es un respaldo válido'));
}
